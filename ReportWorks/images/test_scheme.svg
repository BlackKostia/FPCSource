<svg width="680" height="120" viewBox="0 0 680 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-2%" y="-5%" width="104%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Box 1: Producers -->
  <rect x="10" y="20" width="130" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
  <text x="75" y="45" font-family="Liberation Sans, Arial" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">6 Генераторів</text>
  <text x="75" y="62" font-family="Liberation Sans, Arial" font-size="9" fill="#3b82f6" text-anchor="middle">Multi-Producer</text>
  <text x="75" y="78" font-family="Liberation Sans, Arial" font-size="8.5" fill="#64748b" text-anchor="middle">1 млн транзакцій</text>

  <!-- Arrow 1 -->
  <line x1="140" y1="57" x2="178" y2="57" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Box 2: Inbound Channel -->
  <rect x="180" y="20" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)" />
  <text x="247" y="45" font-family="Liberation Sans, Arial" font-size="11" font-weight="bold" fill="#14532d" text-anchor="middle">Inbound Channel</text>
  <text x="247" y="62" font-family="Liberation Sans, Arial" font-size="9" fill="#16a34a" text-anchor="middle">generic TChannel&lt;T&gt;</text>
  <text x="247" y="78" font-family="Liberation Sans, Arial" font-size="8.5" fill="#64748b" text-anchor="middle">Ring Buffer (Cap: 4096)</text>

  <!-- Arrow 2 -->
  <line x1="315" y1="57" x2="353" y2="57" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Box 3: Workers -->
  <rect x="355" y="20" width="130" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
  <text x="420" y="45" font-family="Liberation Sans, Arial" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">6 Воркерів</text>
  <text x="420" y="62" font-family="Liberation Sans, Arial" font-size="9" fill="#3b82f6" text-anchor="middle">Розрахунок комісій</text>
  <text x="420" y="78" font-family="Liberation Sans, Arial" font-size="8.5" fill="#64748b" text-anchor="middle">Верифікація підпису</text>

  <!-- Arrow 3 -->
  <line x1="485" y1="57" x2="523" y2="57" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Box 4: Outbound & Auditor -->
  <rect x="525" y="20" width="145" height="75" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)" />
  <text x="597" y="45" font-family="Liberation Sans, Arial" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">Outbound &amp; Аудит</text>
  <text x="597" y="62" font-family="Liberation Sans, Arial" font-size="9" fill="#ca8a04" text-anchor="middle">TChannel &#8594; 1 Auditor</text>
  <text x="597" y="78" font-family="Liberation Sans, Arial" font-size="8.5" fill="#64748b" text-anchor="middle">Підсумковий баланс</text>
</svg>