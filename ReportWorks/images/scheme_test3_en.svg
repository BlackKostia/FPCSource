  <text x="222" y="61" font-family="monospace" font-size="8.5" fill="#5b21b6" text-anchor="middle">Shard = ID mod 4</text>

  <line x1="280" y1="28" x2="320" y2="20" stroke="#7c3aed" stroke-width="1.5" />
